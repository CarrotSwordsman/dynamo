family: gemma4
model_label: Gemma 4
mode: stream
cases:
  REASONING.stream.1:
    description: Gemma thought channel across chunks
    chunks:
    - |
      <|channel>thought
      step one
    - |-
      step two<channel|>
    - The answer is 42.
    expected:
      dynamo: &d_s1
        reasoning_text: |-
          step one
          step two
        normal_text: The answer is 42.
      vllm:
        reasoning_text: |-
          <|channel>thought
          step one
          step two
        normal_text: The answer is 42.
        reason: vLLM streaming parser preserves the Gemma channel marker in this chunked stream shape.
      sglang:
        unavailable: SGLang peer not wired for Dynamo parser family 'gemma4'
  REASONING.stream.2:
    description: Start marker split across chunks
    chunks:
    - <|chan
    - |-
      nel>thought
      thinking<channel|>answer
    expected:
      dynamo: &d_s2
        reasoning_text: thinking
        normal_text: answer
      vllm:
        reasoning_text: ''
        normal_text: |-
          <|channel>thought
          thinking<channel|>answer
        reason: vLLM streaming parser misses the Gemma channel start when the marker is split across chunks.
      sglang:
        unavailable: SGLang peer not wired for Dynamo parser family 'gemma4'
  REASONING.stream.3:
    description: End marker split across chunks
    chunks:
    - |-
      <|channel>thought
      thinking<chan
    - nel|>answer
    expected:
      dynamo: &d_s3
        reasoning_text: thinking
        normal_text: answer
      vllm:
        reasoning_text: |-
          <|channel>thought
          thinking<channel|>answer
        normal_text: ''
        reason: vLLM streaming parser does not recover this split Gemma channel end marker shape.
      sglang:
        unavailable: SGLang peer not wired for Dynamo parser family 'gemma4'
